[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/flashbots/rbuilder"
repository = "https://github.com/flashbots/rbuilder"
exclude = [".github/"]

[workspace]
members = [
    "crates/rbuilder-primitives",
    "crates/rbuilder-utils",
    "crates/rbuilder-config",
    "crates/rbuilder",
    "crates/rbuilder-operator",
    "crates/rbuilder-rebalancer",
    "crates/reth-rbuilder",
    "crates/rbuilder/src/test_utils",
    "crates/rbuilder/src/telemetry/metrics_macros",
    "crates/eth-sparse-mpt",
    "crates/sysperf",
    "crates/test-relay",
    "crates/bid-scraper",
]
default-members = [
    "crates/rbuilder",
    "crates/rbuilder-operator",
    "crates/reth-rbuilder",
    "crates/rbuilder-rebalancer",
    "crates/rbuilder-primitives",
    "crates/rbuilder-utils",
    "crates/test-relay",
    "crates/bid-scraper",
]
resolver = "2"

# Speed up compilation time for dev builds by reducing emitted debug info.
# NOTE: Debuggers may provide less useful information with this setting.
# Uncomment this section if you're using a debugger.
[profile.dev]
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Speed up tests.
[profile.dev.package]
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
unarray.opt-level = 3

# Like release, but with full debug symbols. Useful for e.g. `perf`.
[profile.debug-fast]
inherits = "release"
debug = true
lto = "thin"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false

[profile.reproducible]
inherits = "release"
lto = "thin"
panic = "abort"
codegen-units = 1
incremental = false

[workspace.dependencies]
reth = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-cli-util = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-db = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-trie = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-trie-parallel = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-primitives-traits = { version = "0.3.0", default-features = false }
reth-static-file-types = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-provider = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364", features = [
    "test-utils",
] }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-execution-errors = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", rev = "d58c6e3d0723a28f655e89da83c3738e47dcc364" }

# compatible with reth v2.1.0 (d58c6e3d0723a28f655e89da83c3738e47dcc364) dependencies
revm = { version = "38.0.0", features = [
    "std",
    "secp256k1",
    "optional_balance_check",
], default-features = false }
revm-inspectors = { version = "0.39.0", default-features = false }

ethereum_ssz_derive = "0.10"
ethereum_ssz = "0.10"

alloy-primitives = { version = "1.5.6", default-features = false, features = [
    "getrandom",
    "map-foldhash",
] }
alloy-rlp = { version = "0.3.13", default-features = false, features = ["core-net"] }
alloy-chains = { version = "0.2.33", default-features = false }
alloy-trie = { version = "0.9.4", default-features = false }
nybbles = { version = "0.4.8", features = ["serde"], default-features = false }
alloy-evm = { version = "0.33.0", default-features = false }
alloy-hardforks = "0.4.7"
alloy-provider = { version = "2.0.0", features = ["ipc", "pubsub", "ws"], default-features = false }
alloy-eips = { version = "2.0.0", default-features = false }
alloy-rpc-types = { version = "2.0.0", features = ["eth"], default-features = false }
alloy-json-rpc = { version = "2.0.0", default-features = false }
alloy-network = { version = "2.0.0", default-features = false }
alloy-network-primitives = { version = "2.0.0", default-features = false }
alloy-node-bindings = { version = "2.0.0" }
alloy-consensus = { version = "2.0.0", features = ["kzg", "secp256k1"], default-features = false }
alloy-rpc-types-beacon = { version = "2.0.0", features = ["ssz"], default-features = false }
alloy-rpc-types-engine = { version = "2.0.0", default-features = false }
alloy-rpc-types-eth = { version = "2.0.0", default-features = false }
alloy-signer = { version = "2.0.0", default-features = false }
alloy-signer-local = { version = "2.0.0", default-features = false }

# Version required by ethereum-consensus beacon-api-client
mev-share-sse = { git = "https://github.com/paradigmxyz/mev-share-rs", rev = "9eb2b0138ab3202b9eb3af4b19c7b3bf40b0faa8", default-features = false }
beacon-api-client = { git = "https://github.com/ralexstokes/ethereum-consensus/", rev = "5031d31e318dd861cf3373702c5d92f085d926e4" }
ethereum-consensus = { git = "https://github.com/ralexstokes/ethereum-consensus/", rev = "5031d31e318dd861cf3373702c5d92f085d926e4" }

async-trait = { version = "0.1.83" }
clap = { version = "4.4.3", features = ["derive", "env"] }
thiserror = { version = "1.0.64" }
eyre = { version = "0.6.12" }
jsonrpsee = { version = "0.26.0" }
parking_lot = { version = "0.12.3" }
tokio = { version = "1.44.2", default-features = false }
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.12.8" }
serde = { version = "1.0.210" }
serde_json = { version = "1.0" }
serde_with = { version = "3.8.1" }
secp256k1 = { version = "0.30" }
derive_more = { version = "2" }
tokio-stream = "0.1.11"
tokio-util = "0.7.12"
url = "2.5.2"
warp = "0.3.7"
flate2 = "1.0.35"
prometheus = "0.13.4"
ctor = "0.2"
rand = "0.8"
toml = "0.8.8"
tonic = "0.13"
prost = "0.13"
prost-types = "0.13"
exponential-backoff = "1.2.0"
derivative = "2.2"
sha2 = "0.10.8"

lazy_static = "1.4.0"
tikv-jemallocator = { version = "0.6" }
tracing = "0.1.37"
ahash = "0.8.6"
time = { version = "0.3.36", features = ["macros", "formatting", "parsing"] }
uuid = { version = "1.6.1", features = ["serde", "v5", "v4"] }

criterion = "0.5.1"
proptest = "1.5"

eth-sparse-mpt = { path = "crates/eth-sparse-mpt" }
bid-scraper = { path = "crates/bid-scraper" }
rbuilder = { path = "crates/rbuilder" }
rbuilder-primitives = { path = "crates/rbuilder-primitives" }
rbuilder-utils = { path = "crates/rbuilder-utils" }
rbuilder-config = { path = "crates/rbuilder-config" }
sysperf = { path = "crates/sysperf" }
metrics_macros = { path = "crates/rbuilder/src/telemetry/metrics_macros" }


[workspace.metadata.cargo-shear]
# cargo-shear invalidly marks these as unused.
ignored = ["prost", "prost-types"]
